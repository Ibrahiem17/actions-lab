name: Problem 5
on:
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download (simulated flaky network)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i"
            echo "Downloading package..."
            if [ "$i" -eq 3 ]; then
              echo "Download complete"
              exit 0
            fi
            echo "npm error code ECONNRESET"
            echo "npm error network aborted"
            sleep 2
          done
          echo "All 3 attempts failed"
          exit 1
